
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메타몽의 500일 축하 대작전</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7e9ff;font-family:'Malgun Gothic',sans-serif;color:#593b70;text-align:center}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:white;border:3px solid #c79be8;border-radius:28px;padding:30px 20px;width:100%;max-width:430px;box-shadow:0 12px 30px #b88bd544}
h1{font-size:27px;line-height:1.5}
p{line-height:1.9}
.ditto{width:190px;max-width:80%;object-fit:contain;animation:bounce 2s infinite}
button{border:0;background:#ae79d5;color:white;border-radius:30px;padding:14px 24px;font-size:16px;font-weight:bold;cursor:pointer;margin:7px}
button:active{transform:scale(.95)}
.secondary{background:#e9d7f6;color:#684683}
.hidden{display:none}
#game{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#game button{background:#f4e5ff;font-size:28px}
#letter{background:#faf1ff;border-radius:18px;padding:20px;line-height:2.5}
@keyframes bounce{50%{transform:translateY(-12px)}}
</style>
</head>
<body>
<main>
<div class="panel">
<img class="ditto" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/132.png" alt="메타몽">
<h1 id="title">정희님에게 특별한 메시지가 도착했습니다!</h1>
<p id="desc">메타몽이 비밀 임무를 준비했어요 💜</p>
<div id="game"></div>
<div id="letter" class="hidden"></div>
<div id="buttons">
<button onclick="next()">메시지 확인하기</button>
</div>
</div>
</main>
<script>
let step=0,count=0;
const title=document.getElementById("title");
const desc=document.getElementById("desc");
const buttons=document.getElementById("buttons");
const game=document.getElementById("game");
const letter=document.getElementById("letter");

function set(t,d,b){
 title.textContent=t;
 desc.textContent=d;
 buttons.innerHTML=b;
}
function next(){
 step++;
 if(step===1){
  set("500일 기념 퀘스트!","정희님, 메타몽의 부탁을 수락하시겠습니까?",
  '<button onclick="next()">수락 💜</button><button class="secondary" onclick="reject()">거절</button>');
 }else if(step===2){
  set("메타몽을 모아줘!","아래 메타몽 5마리를 눌러 수집해 주세요. (0/5)","");
  count=0;game.innerHTML="";
  for(let i=0;i<5;i++){
   const b=document.createElement("button");
   b.textContent="🟣";
   b.onclick=()=>{
    if(b.disabled)return;
    b.disabled=true;b.textContent="✓";
    count++;
    desc.textContent=`메타몽을 모아 주세요! (${count}/5)`;
    if(count===5)buttons.innerHTML='<button onclick="next()">다음으로!</button>';
   };
   game.appendChild(b);
  }
 }else if(step===3){
  game.innerHTML="";
  set("정희에 대한 사랑 분석 중...","분석을 시작하시겠습니까?",
  '<button onclick="analyze()">분석 시작</button>');
 }else if(step===4){
  set("분석 결과 확인 완료!","정희에 대한 애정도: 무한대 ♾️",
  '<button onclick="next()">최종 결과 확인</button>');
 }else{
  set("정희야 500일 축하해 💜","앞으로도 우리 행복하게 지내자!","");
  letter.classList.remove("hidden");
  letter.innerHTML="벌써 500일이나 됐더<br>내년에 공부 열심히 해서<br>임용 한번에 붙고 나랑 결혼해";
 }
}
function reject(){
 alert("메타몽이 거절을 받아들이지 않았습니다 😝");
}
function analyze(){
 set("분석 중...","정희를 향한 마음을 계산하고 있어요 💜","");
 setTimeout(()=>next(),1800);
}
</script>
</body>
</html>
